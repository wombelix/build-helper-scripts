# Call from a pull_request workflow. Checks only the files the pull request changes.
name: pre-commit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Both ends of the pull request are needed for the diff
          fetch-depth: 0

      - name: Install pre-commit
        run: pipx install pre-commit

      # pre-commit diffs from the merge base, so changes on the base branch are ignored
      - name: Run pre-commit on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pre-commit run --show-diff-on-failure --color always --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
